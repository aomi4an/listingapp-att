<p><a routerLink="/">← К списку</a></p>

@if (listing.isLoading()) {
  <p class="muted">Загрузка…</p>
} @else if (listing.error(); as err) {
  <div class="error-box">
    <p>{{ err | errorMessage }}</p>
    @if (!notFound()) {
      <button type="button" (click)="listing.reload()">Повторить</button>
    }
  </div>
} @else if (item(); as it) {
  <app-listing-details [listing]="it" />

  @if (canEdit()) {
    <div class="actions">
      <a [routerLink]="['/listings', id(), 'edit']" class="btn">Редактировать</a>
      <button type="button" class="danger" (click)="remove()" [disabled]="deleting()">
        {{ deleting() ? 'Удаляем…' : 'Удалить объявление' }}
      </button>
      @if (deleteError(); as msg) {
        <p class="error">{{ msg }}</p>
      }
    </div>
  }
}
