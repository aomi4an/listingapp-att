<div class="head">
  <h1>Мои объявления</h1>
  <a routerLink="/listings/new" class="add">+ Добавить</a>
</div>

@if (items.isLoading()) {
  <app-skeleton [count]="3" />
} @else if (items.error(); as err) {
  <div class="error-box">
    <p>{{ err | errorMessage }}</p>
    <button type="button" (click)="items.reload()">Повторить</button>
  </div>
} @else if (items.hasValue()) {
  @if (list().length === 0) {
    <p class="muted">У вас пока нет объявлений. <a routerLink="/listings/new">Добавить первое</a></p>
  } @else {
    <app-listing-list [listings]="list()" [total]="list().length" />
  }
}
